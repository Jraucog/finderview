name: Release & Build DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Security Tests
        run: npm test

      - name: Build & Package for macOS (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --mac --${{ matrix.arch }} -c.mac.target=dmg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinderView-macos-${{ matrix.arch }}
          path: dist/*.dmg

  create-release:
    name: Create GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all DMG Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/**/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
